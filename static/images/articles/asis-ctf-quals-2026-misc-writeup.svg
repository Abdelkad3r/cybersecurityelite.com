<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ASIS CTF Quals 2026 Misc Mic Check writeup cover — the single Baby-rated misc challenge solved. Five three-row ASCII blocks render leetspeak words in a proportionally-spaced seven-segment font whose top-segment row drifts by one to two columns in three of the five blocks, enough that a naive column-slicing decoder reads cl9ss1l instead of classic and unc3rt4n1 instead of uncertain. The fix stops treating the top row as position and starts treating it as a count. Step one tiles the two pixel-accurate lower rows with variable-width glyph cells that handle single-column one and crossbar t without a fixed pitch. Step two enumerates the only three drift-sensitive twin pairs 4 versus 9, l versus c, u versus 0 whose lower rows are identical. Step three filters candidates by matching the underscore count in the top row and cross-references the de-leeted reading against a wordlist. Every block collapses to exactly one word: farewell classic hello uncertain era. The flag ASIS f4r3w3ll cl4ss1c h3ll0 unc3rt41n 3r4 falls out of joining them with underscores.">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ CTF WRITEUP &#183; MISC &#183; SEVEN-SEGMENT &#183; LEETSPEAK &#183; 2026 ]</text>
  <g transform="translate(940, 44)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">MIC CHECK &#183; SOLVED</text>
  </g>
  <text x="600" y="210" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="80" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">ASIS CTF 2026</text>
  <text x="600" y="272" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#ededef" letter-spacing="-0.02em">QUALIFIERS &#183; MISC &#183; MIC CHECK</text>
  <text x="600" y="332" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">COUNT THE SEGMENTS, DON'T POSITION THEM</text>
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">seven-segment ascii &#183; drifted top row &#183; twin-glyph enum &#183; wordlist arbitrates</text>
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">misc@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">tile(mid,bot) &#8594; enumerate 4/9, l/c, u/0 &#8594; underscore count filter</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">asis@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">f4r3w3ll &#183; cl4ss1c &#183; h3ll0 &#183; unc3rt41n &#183; 3r4! &#8594; ASIS{...}</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>
  <g transform="translate(1075, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
