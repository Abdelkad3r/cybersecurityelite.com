  <text x="600" y="200" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="76" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">AWARENESS 2026</text>
  <text x="600" y="262" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#ededef" letter-spacing="-0.02em">THE AI-POWERED PHISHING PLAYBOOK</text>
  <text x="600" y="322" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">IGNORE THE TYPOS. VERIFY THE CHANNEL.</text>
  <text x="600" y="370" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">deepfake vishing &#183; llm spearphish &#183; aitm mfa-bypass &#183; passkeys</text>
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">you@home</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">rule 1: verify high-impact requests on a channel THEY didn't choose</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">you@work</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">rule 2: passkeys &gt; sms &gt; totp  |  cookies survive MFA, passkeys don't</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com &#183; October 1&#8211;31, 2026</text>
