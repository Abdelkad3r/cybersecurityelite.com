  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ AWARENESS &#183; NCSAM 2026 &#183; PHISHING &#183; PASSKEYS &#183; DEEPFAKE ]</text>
  <g transform="translate(940, 44)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
