<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cybersecurity Awareness Month 2026 cover — the AI-powered phishing playbook. Three 2026 phishing threats dominate: deepfake voice vishing that clones a CEO or family member in seconds from public audio; LLM-crafted spearphishing that produces grammatically perfect personalized emails at scale so 'look for typos' no longer works; and adversary-in-the-middle MFA-bypass proxies (Evilginx-style toolkits) that steal live session cookies from realistic proxy portals even when MFA is enabled. The playbook maps CISA's Secure Our World pillars — strong unique passwords, phishing-resistant MFA (passkeys / FIDO2 / WebAuthn), phishing recognition, keep software updated — onto 2026's threat surface and gives employees a verify-out-of-band callback rule, a passkey-first rollout script, an AI-phishing red-flag checklist, and an HR/IT NCSAM October calendar with runnable training exercises.">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
