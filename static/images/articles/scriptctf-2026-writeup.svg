<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="scriptCTF 2026 writeup covering both released challenges — Misdirection is a 115-bit blob that splits cleanly into 23 five-bit groups and only decodes under Bacon's original 24-letter alphabet where I and J share a symbol and U and V share a symbol, revealing scriptCTF{notwhatitseems}; and F**K is a 28,786-byte Brainfuck program that hides 31 algebraic byte checks of the form input += C then temp = A times K plus B then input -= temp inside deliberate visual noise, encodes the entire flag in the iteration count of the [-] clear loops with no printable success message, and reveals scriptCTF{t1mm1ng_s1d$_ch@nn31}">
