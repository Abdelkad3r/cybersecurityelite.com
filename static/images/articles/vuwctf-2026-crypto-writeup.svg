<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="VuwCTF 2026 cryptography writeup — three challenges covering nom-nom an RSA scheme with public exponent 3 giving two ciphertexts of related plaintexts under a single modulus broken with the Franklin-Reiter related-message attack via a polynomial gcd over Z mod n; concord an AES-CBC key schedule whose op function is multiplication in the field GF(257) so Fermat's little theorem collapses a billion-byte inner product to a single constant P leaving only 256 candidate keys to brute force; and D a 16-round CBC block cipher over GF(2 to the 128) whose nonlinear round function is the Dickson polynomial D_13 of x with parameter 19 inverted using the composition identity with inverse exponent m equal to 13 inverse mod 2 to the 256 minus 1 to decrypt the flag PNG">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ CTF WRITEUP &#183; CRYPTOGRAPHY &#183; 2026 ]</text>
  <g transform="translate(940, 44)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">3 / 3 SOLVED</text>
  </g>
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="94" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.03em">VUWCTF 2026</text>
  <text x="600" y="320" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">CRYPTOGRAPHY &#183; STEP BY STEP</text>
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">franklin&#8211;reiter rsa &#183; gf(257) collapse &#183; dickson polynomials</text>
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">crypto@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">gcd(x&#179;&#8722;c&#8321;, (Ax+B)&#179;&#8722;c&#8322;) mod n &#8594; x &#8722; m  &#124;  c^2&#179;&#8304; &#8801; 1 &#8594; P</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">crypto@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">D_13(x,19), m = 13&#8315;&#185; mod 2&#178;&#8309;&#8310;&#8722;1 &#8594; invert &#8594; VuwCTF{&#8230;}</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>
  <g transform="translate(1075, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
