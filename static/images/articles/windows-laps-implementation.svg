<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Windows LAPS implementation step-by-step enterprise guide">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededef"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow -->
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ TUTORIAL · IDENTITY &amp; ACCESS · 2026 ]</text>

  <!-- Status pill -->
  <g transform="translate(940, 44)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#22d3ee"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">STEP-BY-STEP · 8 PHASES</text>
  </g>

  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="148" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">WINDOWS LAPS</text>

  <!-- Subtitle line 1 -->
  <text x="600" y="330" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#9ba0a8" letter-spacing="0.08em">LOCAL ADMINISTRATOR PASSWORD SOLUTION</text>

  <!-- Subtitle line 2 (big) -->
  <text x="600" y="400" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.04em">Enterprise Deployment Guide</text>

  <!-- Decorative PowerShell prompt -->
  <g transform="translate(60, 510)" font-family="ui-monospace, monospace" font-size="16">
    <text x="0" y="0" fill="#22d3ee">PS C:\&gt;</text>
    <text x="78" y="0" fill="#ededef">Update-LapsADSchema; Add-KdsRootKey -EffectiveImmediately</text>
    <text x="78" y="22" fill="#a78bfa">PS C:\&gt;</text>
    <text x="156" y="22" fill="#ededef">Set-LapsADComputerSelfPermission -Identity "OU=Servers,DC=corp,DC=local"</text>
  </g>

  <!-- Bottom-left brand -->
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>

  <!-- Bottom-right key icon -->
  <g transform="translate(1090, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="36" r="12"/>
    <path d="M26 36 L62 36 L62 50 M52 36 L52 46"/>
    <circle cx="14" cy="36" r="3" fill="#22d3ee"/>
  </g>
</svg>
