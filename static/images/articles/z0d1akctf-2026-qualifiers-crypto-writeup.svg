<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="z0d1akCTF 2026 Qualifiers Cryptography writeup cover — all six Crypto challenges solved. siren exploits an ECDSA nonce whose top 10 bits are public and turns 40 signatures into a Hidden Number Problem lattice that LLL solves for the private key. Rewind reads the raw keystream by encrypting 44 zero bytes through an oracle whose counter resets every call. Rewind Revenge exploits an AES-GCM nonce reuse where the single-block tag is affine over GF128, so two seals reveal H-squared and a forged tag opens the print_the_flag command. You Have Not Seen My Colors filters a 100 by 100 RGB PNG on blue equals zero to reveal 166 sentinel pixels forming Elian script for MASTER OF CTF. cyclotomic-echo uses the private NTRU-style basis in recovery.json where f G minus g F equals 1 to sign the parity target by reducing coefficients modulo 2 and mapping back through the integral inverse. THESEUS reads seven expected marks out of EIP-1967 proxy storage slots and recovers the flag from the Setup contract's creation input on the immutable blockchain history">
