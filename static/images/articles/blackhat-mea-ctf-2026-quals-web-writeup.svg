<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Black Hat MEA CTF Qualification 2026 Web writeup cover — Lumen challenge: three-stage chain. Stage one: split %3c across dir and file GET parameters to inject one raw less-than past the per-parameter htmlspecialchars filter, then urldecode on the concatenation completes the angle bracket. Stage two: flood the request with more than 1000 GET parameters to trigger PHP's max_input_vars startup warning which, with display_errors=1 and output_buffering=0, is written to the response socket before index.php calls header(), causing the Content-Security-Policy to be silently dropped. Stage three: the now-unblocked img onerror handler reads the bot's localStorage flag and writes it to the same-origin trace store via a plain GET request, which the attacker then reads back.">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ WEB &#183; XSS &#183; CSP-BYPASS &#183; PHP &#183; LOCALSTORAGE &#183; QUALS 2026 ]</text>
  <g transform="translate(960, 44)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">3-STAGE CHAIN</text>
  </g>
  <text x="600" y="200" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="68" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">BLACK HAT MEA 2026</text>
  <text x="600" y="262" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#ededef" letter-spacing="-0.02em">QUALIFIERS &#183; WEB</text>
  <text x="600" y="318" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">LUMEN &#183; CSP BYPASS</text>
  <text x="600" y="368" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">split-%3c-filter &#183; max_input_vars-header-race &#183; localstorage-xss &#183; trace-exfil</text>
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="15"><tspan fill="#22d3ee">inject@lumen</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">dir=docs/%3 + file=c&#8230; &#8594; urldecode(concat) &#8594; docs/&lt;img onerror=&#8230;&gt;</tspan></text>
    <text x="0" y="24" font-family="ui-monospace, monospace" font-size="15"><tspan fill="#22d3ee">csp@drop</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">&gt;1000 params &#8594; php startup warning &#8594; headers flushed &#8594; CSP header lost</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>
  <g transform="translate(1075, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <line x1="2" y1="0" x2="2" y2="72"/>
    <polygon points="5,4 48,18 5,32" fill="#22d3ee" stroke="none"/>
