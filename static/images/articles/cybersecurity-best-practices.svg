  <text x="600" y="272" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#ededef" letter-spacing="-0.02em">BEST PRACTICES &#183; CHECKLIST</text>
  <text x="600" y="332" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">TEN PILLARS, ONE STANDARD OF CARE</text>
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">passkeys &#183; auto-update &#183; 3-2-1 backup &#183; least privilege &#183; verify out-of-band</text>
