<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Black Hat MEA CTF Qualification 2026 Crypto writeup cover — Hokan: 5-term 11-variable polynomial over secret F_p, weighted-degree substitution z^{i·K_j} collapses to Ben-Or/Tiwari roots in a 34-element set, GCD of integer annihilators recovers p, Vandermonde solve for coefficients, low-density LLL+Babai modular knapsack over first 11 primes pins the monomials, degrevlex str(f) reproduction; Popcnt Oracle: RSA-2048 Hamming-weight oracle, multiplicative blinding c·r^e decrypts to m·r, modular-doubling binary-digit extraction via positive and negative orbit pair, adaptive 3079-query collection, sparse r=3 and r=5 streams resolve 18 erasures in 2067 prefix nodes.">
