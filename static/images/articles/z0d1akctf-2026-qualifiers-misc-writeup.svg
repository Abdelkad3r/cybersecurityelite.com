<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="z0d1akCTF 2026 Qualifiers Miscellaneous writeup cover — all four Misc challenges solved. genie exploits a Game Boy replay service whose 12-write cheat port lets an atomic three-word write to the C100 through C105 window bypass the ROM validator; ihateDAA runs a parallel BFS keyed on the HTML title element over a cyclic 92 thousand node graph with 63 thousand back edges to find the single Flag Found sink of in-degree one nine hops from a root; Control Plane exploits an EVM kernel parser differential where the audited validator reads record lengths little-endian but the executor reads them big-endian, hiding a DELEGATECALL that arms the mode-two gate and a CALL that drains 100 ETH behind a 0x12 skip record; Sanity Check reads a Cloudflare-injected style tag whose CSS custom property never renders and is keyed on hostname, then Base58 decodes the concatenation of apex plus www to recover the flag phrase all the best we hope you enjoy the ctf">
