    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">START HERE</text>
  </g>
  <text x="600" y="208" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="74" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.03em">GET INTO</text>
  <text x="600" y="284" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="74" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.03em">CYBERSECURITY</text>
  <text x="600" y="348" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.04em">WITH CTFs &#183; A HANDS-ON ROADMAP</text>
  <text x="600" y="400" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#9ba0a8" letter-spacing="0.02em">foundations &#8594; solve flags &#8594; write it up &#8594; get hired</text>
  <g transform="translate(60, 505)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">learn@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">PicoCTF &#8594; TryHackMe &#8594; HTB Academy &#8594; Hack The Box &#8594; live CTFs</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">learn@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">web &#183; crypto &#183; pwn &#183; reverse &#183; forensics &#183; osint</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>
  <g transform="translate(1075, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
