<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kerberoasting detection in Splunk">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededef"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow -->
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ TUTORIAL · THREAT DETECTION · 2026 ]</text>

  <!-- Status pill (top-right) -->
  <g transform="translate(960, 44)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">TUTORIAL</text>
  </g>

  <!-- Main title: KERBEROASTING -->
  <text x="600" y="270" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="95" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.02em">KERBEROASTING</text>

  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="url(#cyan-grad)" letter-spacing="0.06em">DETECTION GUIDE</text>

  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#9ba0a8" font-weight="400">Event 4769 · RC4 Patterns · Volume Spikes · Dashboards</text>

  <!-- Terminal panel (bottom) -->
  <g transform="translate(60, 510)" font-family="ui-monospace, monospace" font-size="16">
    <text x="0" y="0" fill="#22d3ee">soc@splunk</text>
    <text x="110" y="0" fill="#9ba0a8">:</text>
    <text x="118" y="0" fill="#a78bfa">~</text>
    <text x="130" y="0" fill="#9ba0a8">$</text>
    <text x="146" y="0" fill="#ededef">index=wineventlog EventCode=4769 Ticket_Encryption_Type="0x17" \</text>
    <text x="260" y="22" fill="#ededef">| stats count by Account_Name | where count > 20</text>
  </g>

  <!-- Bottom-left brand -->
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>

  <!-- Bottom-right shield icon -->
  <g transform="translate(1080, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 0 L0 14 L0 34 Q0 58 30 72 Q60 58 60 34 L60 14 Z"/>
    <path d="M18 33 L27 42 L42 25"/>
  </g>
</svg>