<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="eJPT vs PNPT in 2026 — a head-to-head comparison of the two most popular entry practical penetration testing certifications: the beginner INE eJPT with a hands-on lab and dynamic questions and no report, versus the intermediate TCM Security PNPT with a five-day exam, a professional report, a live debrief, and Active Directory focus, plus guidance on which to take first">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ CYBERSECURITY ELITE &#183; CERT COMPARISON &#183; 2026 ]</text>
  <g transform="translate(985, 44)">
    <rect x="0" y="0" width="155" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#a78bfa"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">HEAD-TO-HEAD</text>
  </g>
  <text x="600" y="248" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="112" font-weight="800" letter-spacing="-0.02em"><tspan fill="url(#title-grad)">eJPT</tspan><tspan fill="#6b7280"> vs </tspan><tspan fill="url(#title-grad)">PNPT</tspan></text>
  <text x="600" y="320" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.04em">WHICH ENTRY PENTEST CERT?</text>
  <text x="600" y="372" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#9ba0a8" letter-spacing="0.02em">beginner &amp; hands-on   vs   report + live debrief + AD</text>
  <g transform="translate(60, 505)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">cert@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">eJPT: lab + dynamic questions &#183; no report &#183; ~$249</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">cert@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">PNPT: 5-day exam &#183; report + debrief &#183; take eJPT first</tspan></text>
  </g>
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>
  <g transform="translate(1075, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <line x1="2" y1="0" x2="2" y2="72"/>
    <polygon points="5,4 48,18 5,32" fill="#22d3ee" stroke="none"/>
  </g>
