<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Windows 11 enterprise hardening guide 2026">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededef"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow -->
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ ULTIMATE GUIDE · CIS-ALIGNED · 2026 ]</text>

  <!-- Status pill -->
  <g transform="translate(940, 44)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">90-DAY ROLLOUT PLAN</text>
  </g>

  <!-- Main title line 1 -->
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="138" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">HARDEN</text>
  <!-- Main title line 2 -->
  <text x="600" y="360" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="138" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">WINDOWS 11</text>

  <!-- Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">Enterprise · Defender · Intune · GPO</text>

  <!-- Decorative bottom bar with categories -->
  <g transform="translate(60, 510)" font-family="ui-monospace, monospace" font-size="14" fill="#9ba0a8" letter-spacing="0.05em">
    <text x="0" y="0">10 PHASES</text>
    <text x="110" y="0" fill="#1f1f2a">|</text>
    <text x="125" y="0">16 ASR RULES</text>
    <text x="250" y="0" fill="#1f1f2a">|</text>
    <text x="265" y="0">CREDENTIAL GUARD</text>
    <text x="430" y="0" fill="#1f1f2a">|</text>
    <text x="445" y="0">LAPS</text>
    <text x="495" y="0" fill="#1f1f2a">|</text>
    <text x="510" y="0">BITLOCKER + PIN</text>
    <text x="660" y="0" fill="#1f1f2a">|</text>
    <text x="675" y="0">SMART APP CONTROL</text>
    <text x="850" y="0" fill="#1f1f2a">|</text>
    <text x="865" y="0">ZERO TRUST</text>
  </g>

  <!-- Bottom-left brand -->
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>

  <!-- Bottom-right shield icon (layered) -->
  <g transform="translate(1080, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 0 L0 14 L0 34 Q0 58 30 72 Q60 58 60 34 L60 14 Z"/>
    <path d="M18 33 L27 42 L42 25"/>
    <path d="M-4 16 L0 14 M64 16 L60 14" opacity="0.5"/>
  </g>
</svg>
