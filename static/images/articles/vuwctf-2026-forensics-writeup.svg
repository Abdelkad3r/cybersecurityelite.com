<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="VuwCTF 2026 forensics writeup — the compression challenge ships an unknown file compressed.dat that the file command reports only as data with no recognizable format, but a hex dump reveals a repeating pattern of a small count byte followed by a printable ASCII value byte which is a custom run-length encoding; decoding the count-value pairs expands the stream into a seven-line ASCII-art banner that is a FIGlet rendering in the varsity font of the flag confirmed exactly by re-rendering the candidate flag with pyfiglet">
  <defs>
