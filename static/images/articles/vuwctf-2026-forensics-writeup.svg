  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="94" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.03em">VUWCTF 2026</text>
  <text x="600" y="320" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#accent-grad)" letter-spacing="0.05em">FORENSICS &#183; STEP BY STEP</text>
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="19" font-weight="500" fill="#9ba0a8" letter-spacing="0.03em">custom byte-pair rle &#183; figlet ascii-art flag recovery</text>
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">dfir@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">file compressed.dat &#8594; data  &#124;  xxd &#8594; (count,byte) rle pairs</tspan></text>
    <text x="0" y="22" font-family="ui-monospace, monospace" font-size="16"><tspan fill="#22d3ee">dfir@elite</tspan><tspan fill="#9ba0a8">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#9ba0a8"> $ </tspan><tspan fill="#ededef">expand &#8594; figlet varsity banner &#8594; pyfiglet verify &#8594; VuwCTF{&#8230;}</tspan></text>
