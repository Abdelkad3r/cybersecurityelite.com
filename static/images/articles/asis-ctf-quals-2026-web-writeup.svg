<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ASIS CTF Quals 2026 Web writeup cover — both Web challenges solved. 2048 chains a spoofable X-Forwarded-For diagnostics gate, an Apache Tomcat 9.0.116 EncryptInterceptor bypass CVE-2026-34486 that still forwards the original plaintext ChannelData after a decryption failure, and a Commons Collections 6 gadget wrapped in a FLT2002/TLF2003 Tribes envelope with a MemberImpl source to reach ObjectInputStream.readObject on TCP port 4000 and execute a bash brace-expansion wrapper that concatenates the two randomly-named flag fragments into the world-writable /opt/citadel/shared for pickup through the one-shot /mirror.jsp endpoint. Another Baby Web! is a Flask LFI behind three checks: a one-pass replace of dot-dot-slash that ....// escapes after the single strip, a bad_data body filter that Range: bytes=4- bypasses because send_file conditional=true reshapes the body before inspection, and an airtight is_forbidden denylist against /etc /dev /proc /entrypoint.sh that acts as a red herring. The obvious flag.txt files are decoys; the real flag lives in a randomly-named directory discovered by reading /var/lib/plocate/plocate.db over the LFI in 60 KiB windows, decompressing its zstd frames with the embedded dictionary, and parsing the resulting 9178-path filesystem listing for a flag path.">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ededef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="accent-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ CTF WRITEUP &#183; WEB &#183; TOMCAT &#183; CVE-2026-34486 &#183; LFI &#183; 2026 ]</text>
