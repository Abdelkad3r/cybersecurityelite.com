<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Disable LLMNR and NBT-NS via Group Policy">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededef"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#0d0d12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="strike-shadow" x="-2%" y="-50%" width="104%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow -->
  <text x="60" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="0.18em" font-weight="500">[ TUTORIAL · NETWORK SECURITY · 2026 ]</text>

  <!-- Status pill (top-right) -->
  <g transform="translate(960, 44)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#0a0a12" stroke="#1f1f2a" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <text x="34" y="21" font-family="ui-monospace, monospace" font-size="13" fill="#ededef" letter-spacing="0.06em">VULNERABLE · LEGACY</text>
  </g>

  <!-- Main title: LLMNR -->
  <text x="600" y="240" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="95" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">LLMNR</text>

  <!-- NBT-NS subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="95" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.04em">NBT-NS</text>

  <!-- Red diagonal strike-through -->
  <g filter="url(#strike-shadow)">
    <line x1="180" y1="320" x2="1020" y2="200" stroke="#ef4444" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  </g>

  <!-- Subtitle line 1 -->
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="url(#cyan-grad)" letter-spacing="0.06em">DISABLE</text>

  <!-- Subtitle line 2 -->
  <text x="600" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#9ba0a8" font-weight="400">stop name resolution poisoning · responder mitigation · group policy</text>

  <!-- Decorative code prompt line -->
  <g transform="translate(60, 510)" font-family="ui-monospace, monospace" font-size="16">
    <text x="0" y="0" fill="#22d3ee">PS C:\&gt;</text>
    <text x="65" y="0" fill="#ededef">Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' \</text>
    <text x="150" y="22" fill="#ededef">-Name EnableMulticast -Value 0</text>
  </g>

  <!-- Bottom-left brand -->
  <text x="60" y="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#9ba0a8" letter-spacing="0.04em">cybersecurityelite.com</text>

  <!-- Bottom-right shield icon -->
  <g transform="translate(1080, 555)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30 0 L0 14 L0 34 Q0 58 30 72 Q60 58 60 34 L60 14 Z"/>
    <path d="M18 33 L27 42 L42 25"/>
  </g>
</svg>