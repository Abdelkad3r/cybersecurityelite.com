<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="BushBashCTF 2026 reverse engineering writeup — six challenges covering Hack The Vault I a stripped PIE ELF whose password sits in plaintext in the rodata section; password a login service that speaks COBS Consistent Overhead Byte Stuffing where credentials must be wrapped in zero-delimited frames; a C++ template metaprogramming file whose hundreds of enable_if constraints form an integer system over 214 flag bytes solved with the Z3 SMT solver; a second templates challenge that is a compile-time interpreter for a tiny imperative DSL that turns out to be a 16-round Feistel cipher inverted to recover the plaintext; mystery server I a Rust prost protobuf plus COBS client whose readflag subcommand is not yet implemented so the read_flag message is hand-encoded then COBS-framed; and Turned Around a 10 KB Brainfuck program with guarded hidden branches extracted and re-executed to reveal two masked password fragments documented as unresolved">
