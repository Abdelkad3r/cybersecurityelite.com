###############################################################################
# CyberSecurity Elite — article generation pipeline (Claude variant)
#
# Same UX as generate-article.yml (OpenAI) but uses Claude Code under the
# hood. Authenticates with your Max plan's OAuth token, so workflow runs
# consume your $100/mo Claude subscription quota — no separate API bill.
#
# REQUIRED SECRET: CLAUDE_CODE_OAUTH_TOKEN
#   Generate on your local machine:
#       claude setup-token
#   Then copy the printed sk-ant-oat01-... value into
#   Settings → Secrets and variables → Actions → New repository secret.
#
# Quality: matches the prose depth of the hand-written tutorials on the blog
# (Sonnet 4.6 or whichever model your Max plan uses by default).
###############################################################################
name: Generate Article (Claude)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (e.g. "Kerberoasting Detection in Splunk")'
        required: true
        type: string
      section:
        description: 'Hugo section under content/'
        required: true
        type: choice
        options:
          - tutorials
          - posts
          - news
          - tools
          - certifications
          - bug-bounty
          - career
          - cloud-security
          - forensics
          - malware-analysis
          - network-security
          - reverse-engineering
          - web-security
      intent:
        description: 'Override auto-classified intent (blank = let Claude decide)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - tutorial
          - guide
          - analysis
          - comparison
          - news
          - troubleshooting

concurrency:
  group: generate-article-claude
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.161.1
  TZ: UTC

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # for pushing the article commit
      pull-requests: write  # for opening the draft PR
      actions: write        # for dispatching hugo.yml after push

    steps:
      # ───────────────────────────────────────────────────────────────────
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install image tooling (librsvg2-bin, webp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin webp

      - name: Set up Hugo extended ${{ env.HUGO_VERSION }}
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure git identity
        run: |
          git config user.name  "Article Pipeline (Claude)"
          git config user.email "article-pipeline@cybersecurityelite.com"

      # ───────────────────────────────────────────────────────────────────
      # The agent step. Claude reads existing articles for style, writes a
      # new one + cover, verifies the Hugo build, and commits. We handle
      # the push / PR step ourselves below so the workflow controls auth.
      # ───────────────────────────────────────────────────────────────────
      - name: Run Claude Code agent
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          timeout_minutes: "15"
          prompt: |
            You are generating one blog article for the **CyberSecurity Elite**
            Hugo site. Read existing articles first to lock the brand voice,
            then produce the new article + cover, then commit (no push).

            ## Inputs (from the workflow_dispatch trigger)
            - **Topic:** ${{ inputs.topic }}
            - **Hugo section:** `content/${{ inputs.section }}/`
            - **Intent:** `${{ inputs.intent }}` (blank → auto-classify from topic phrasing)
            - **Publish mode:** direct publish (draft:false, no PR, no human review — your Step 4 self-review is the gate)

            ## Step 1 — Study the brand voice

            Read these three existing tutorials end-to-end to learn the
            front-matter schema, prose voice, code-block conventions, FAQ
            shape, and Hugo shortcode usage. **Do not skim.**

            - `content/tutorials/disable-ntlm-windows.md`
            - `content/tutorials/windows-laps-implementation.md`
            - `content/tutorials/adfs-security-hardening.md`

            Then read **one cover SVG** for the template:
            - `static/images/articles/disable-ntlm-windows.svg`

            ## Step 2 — Generate the article

            Write a new markdown file at
            `content/${{ inputs.section }}/<slug>.md` following the schema and
            voice you just studied. Hard constraints:

            **Front matter (YAML):**
            - `title`: 50-65 chars, primary keyword in position 1, year in parens only for time-sensitive content
            - `slug`: kebab-case, ASCII, 3-6 words
            - `description`: 140-160 chars, primary keyword once, ends with a concrete benefit clause
            - `date` / `lastmod`: ISO 8601 UTC. **Use this exact value** — run `date -u -d '2 hours ago' +"%Y-%m-%dT%H:%M:%SZ"` in a Bash tool call and paste the output verbatim into both fields. The Hugo config has `buildFuture = false`, so any future-dated article is silently dropped from the production build and the URL 404s post-merge. The 2-hour back-date is a hard safety margin against runner clock skew.
            - `draft: false` — this is the autopilot path; the article publishes on push. Your Step 4 self-review is the gate.
            - `author`: `"CyberSecurity Elite Team"`
            - `categories`: 1-2 Title-Case strings matching the section's nature
            - `tags`: 8-14 lowercase strings (broad technique + specific sub-techniques + audience)
            - `keywords`: 10-18 lowercase strings (primary + 2-3 variations + long-tail phrases)
            - `toc: true`
            - `cover`: `image: /images/articles/<slug>.png` + `alt: "<descriptive alt text>"`

            **Body:**
            - **No H1** (Hugo renders it from the title). Start with a thesis paragraph, then H2 sections.
            - Intent-specific structure:
              - **tutorial:** Concept → prereqs → step-by-step (wrap steps in `{{< howto title="..." totalTime="PT15M" >}}...{{< /howto >}}`) → verification → troubleshooting → references → FAQ
              - **guide:** Concept → "X for Y" sections → decision matrix → FAQ
              - **analysis:** Background → technical breakdown → detection (Sigma/KQL/SPL in code blocks) → IOCs → defender playbook → FAQ
              - **comparison:** At-a-glance table → per-option deep-dive → side-by-side dimensions → verdict → FAQ
              - **news:** TLDR → details → impact → detection → mitigation → references → FAQ
              - **troubleshooting:** Symptoms → root cause → primary fix → fallback fixes → prevention → FAQ
            - **Mandatory bottom block:** `{{< faq >}}[...]{{< /faq >}}` with 8-12 entries, each 150-400 chars, self-contained.
            - Use `{{< callout type="info|warning" title="..." >}}...{{< /callout >}}` 1-3 times max for warnings or critical context.
            - Code blocks: triple-backtick with explicit language tag (`bash`, `powershell`, `python`, `kql`, `splunk`, `sigma`, `yaml`, `text`).
            - Word count: 1,500-2,800 for tutorial/guide/comparison/troubleshooting; 1,800-3,200 for analysis/news.
            - **Accuracy is the floor.** Do not invent CVE numbers, exact event IDs you're not sure about, registry paths, or vendor product versions. If you don't know, omit.
            - **No filler.** No "As an AI...", no "In this article we will explore...". Lead with substance.

            ## Step 3 — Generate the cover

            Create `static/images/articles/<slug>.svg` by:
            1. Reading the disable-ntlm-windows.svg as template
            2. Substituting these fields (keep the dark grid + cyan/violet gradients):
               - **Eyebrow (top-left):** `[ INTENT-LABEL · SECTION-LABEL · 2026 ]` where INTENT-LABEL is one of `TUTORIAL`/`GUIDE`/`DEEP DIVE`/`COMPARISON`/`NEWS`/`TROUBLESHOOT` and SECTION-LABEL is the human section name in CAPS (`NETWORK SECURITY`, `MALWARE ANALYSIS`, etc.)
               - **Badge (top-right pill):** intent-specific tag like `TUTORIAL`, `DEEP DIVE`, `GUIDE`, `ANALYSIS`, `COMPARISON`, `NEWS`. Use violet `#a78bfa` for the dot.
               - **Title (centred, big):** 1-3 word UPPERCASE brand title for the article. Auto-size by char count: 130pt for ≤13 chars, 120pt for 14-15, 110pt for 16-18, 95pt for 19+.
               - **Subtitle (under title):** 1-3 word descriptor in CAPS (e.g. `DETECTION GUIDE`, `PLAYBOOK`)
               - **Tagline (below subtitle):** 4-5 concepts separated by ` · `, under 55 chars total
               - **Terminal panel (bottom):** 2 lines of realistic command examples matching the topic, with `<section-slug>@kali` as the prompt user

            Then convert:
            ```
            rsvg-convert -w 1200 -h 630 static/images/articles/<slug>.svg -o static/images/articles/<slug>.png
            cwebp -quiet -q 85 static/images/articles/<slug>.png -o static/images/articles/<slug>.webp
            ```

            ## Step 4 — Self-review (mandatory, executable, iterate up to 3 times)

            You are now the reviewer. Run THIS exact bash block from the
            repo root. **If any check fails: fix the article, then re-run
            the full block.** Maximum 3 iterations. If still failing after
            3, exit non-zero so the workflow fails loudly (do NOT commit a
            broken article — better to fail visibly).

            ```bash
            SECTION=${{ inputs.section }}
            # SLUG = your chosen slug from front matter
            F=content/$SECTION/$SLUG.md
            fails=0

            # 1. Title length 50-65
            title=$(awk -F'"' '/^title:/{print $2; exit}' "$F")
            len=${#title}
            [ "$len" -ge 50 ] && [ "$len" -le 65 ] \
              || { echo "FAIL: title $len chars (need 50-65): $title"; fails=$((fails+1)); }

            # 2. Description length 140-160
            desc=$(awk -F'"' '/^description:/{print $2; exit}' "$F")
            len=${#desc}
            [ "$len" -ge 140 ] && [ "$len" -le 160 ] \
              || { echo "FAIL: description $len chars (need 140-160)"; fails=$((fails+1)); }

            # 3. draft: false (NOT true)
            grep -q '^draft: false$' "$F" \
              || { echo "FAIL: draft is not false"; fails=$((fails+1)); }

            # 4. date is in the past
            date_val=$(awk -F': ' '/^date:/{print $2; exit}' "$F")
            now=$(date -u +%s)
            art=$(date -u -d "$date_val" +%s 2>/dev/null || echo 0)
            [ "$art" -lt "$now" ] \
              || { echo "FAIL: date $date_val is not in the past"; fails=$((fails+1)); }

            # 5. No banned filler phrases
            for p in "As an AI" "In this article we will" "Let'\''s dive in" "In conclusion,"; do
              ! grep -qF "$p" "$F" \
                || { echo "FAIL: banned filler '\''$p'\''"; fails=$((fails+1)); }
            done

            # 6. Hugo builds it (prod mode, no --buildDrafts) + structural counts
            hugo --quiet >/dev/null 2>&1
            html=public/$SECTION/$SLUG/index.html
            if [ ! -f "$html" ]; then
              echo "FAIL: Hugo did not render the page (date in future? draft true?)"
              fails=$((fails+1))
            else
              h1=$(grep -c '<h1' "$html")
              h2=$(grep -c '<h2' "$html")
              [ "$h1" = "1" ] || { echo "FAIL: H1 count $h1 (need exactly 1)"; fails=$((fails+1)); }
              [ "$h2" -ge 3 ] || { echo "FAIL: H2 count $h2 (need >=3)"; fails=$((fails+1)); }
              grep -q FAQPage "$html" \
                || { echo "FAIL: FAQPage JSON-LD schema missing — is {{< faq >}} in the body?"; fails=$((fails+1)); }
            fi

            # 7. Word count in range
            wc_count=$(awk 'NR>1 && !/^---/{p=1} p' "$F" | wc -w)
            [ "$wc_count" -ge 1500 ] && [ "$wc_count" -le 3200 ] \
              || { echo "FAIL: word count $wc_count out of 1500-3200"; fails=$((fails+1)); }

            if [ "$fails" -gt 0 ]; then
              echo ""
              echo "$fails check(s) failed — FIX the article and re-run THIS block before committing"
              exit 1
            fi
            echo "✓ all self-review checks passed ($wc_count words, $h1 H1, $h2 H2)"
            ```

            Track your iterations. After 3 failed attempts, stop and exit
            with a clear summary of what you couldn't fix. Don't commit a
            broken article.

            ## Step 5 — Commit (do not push; the workflow handles push)

            ```
            git add content/${{ inputs.section }}/<slug>.md
            git add static/images/articles/<slug>.{svg,png,webp}
            git commit -m "${{ inputs.section }}: publish <slug> (<title>)

            Auto-generated via Claude Code Action with executable self-review.

            Co-Authored-By: Claude <noreply@anthropic.com>"
            ```

            Print one line at the end: the slug + title + word count.

            ## Output

            When you're done, print a one-line summary of the slug, title,
            section, and word count. The workflow uses this to construct the
            PR title and step summary.

      # ───────────────────────────────────────────────────────────────────
      # Push the article commit straight to main. The Hugo deploy workflow
      # (hugo.yml) picks up the push and publishes in ~60s. No PR step,
      # no draft flag, no human review — Step 4 of the agent prompt is
      # the gate.
      # ───────────────────────────────────────────────────────────────────
      - name: Push article to main
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin main

      # GitHub Actions silently swallows the on:push trigger when the push
      # is performed by GITHUB_TOKEN (prevents recursive workflow loops).
      # Without this explicit dispatch, hugo.yml wouldn't fire and the
      # article never gets built into the live site — visible as a 404
      # despite a clean commit on main.
      - name: Trigger Hugo deploy explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run hugo.yml --ref main
          echo "→ deploy dispatched; article live in ~60s"

      # ───────────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "## Article generation run (Claude)"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| Topic    | ${{ inputs.topic }} |"
            echo "| Section  | ${{ inputs.section }} |"
            echo "| Intent   | ${{ inputs.intent || 'auto' }} |"
            echo "| Model    | Claude (Max subscription quota) |"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "✅ Article pushed to **main** with draft:false (executable self-review passed)."
              echo "🚀 Hugo deploy workflow will publish to the live site in ~60s."
            else
              echo "❌ Job failed — see logs above. Self-review either rejected the draft or another step errored."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
