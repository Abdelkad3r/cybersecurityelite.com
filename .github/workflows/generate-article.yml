###############################################################################
# CyberSecurity Elite — article generation pipeline
#
# Triggered manually from the Actions tab. Produces a Hugo article + cover
# (SVG/PNG/WebP) using seo-pipeline/article.py, then either:
#
#   - publish: true  → commits + pushes straight to main (deploy workflow takes it from there)
#   - publish: false → pushes to a draft/<timestamp>-<slug> branch and opens a PR for review
#
# The OpenAI API key is read from the OPENAI_API_KEY repository secret.
# Set it once at: Settings → Secrets and variables → Actions → New repository secret.
###############################################################################
name: Generate Article

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (e.g. "Kerberoasting Detection in Splunk")'
        required: true
        type: string
      section:
        description: 'Hugo section under content/'
        required: true
        type: choice
        options:
          - tutorials
          - posts
          - news
          - tools
          - certifications
          - bug-bounty
          - career
          - cloud-security
          - forensics
          - malware-analysis
          - network-security
          - reverse-engineering
          - web-security
      intent:
        description: 'Override auto-classified intent (blank = auto)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - tutorial
          - guide
          - analysis
          - comparison
          - news
          - troubleshooting
      publish:
        description: 'Commit straight to main? (false = open a PR for review)'
        required: false
        type: boolean
        default: false
      model:
        description: 'OpenAI model override (default: gpt-4o)'
        required: false
        type: string
        default: 'gpt-4o'

# Serialize runs so two simultaneous triggers can't both push to main.
concurrency:
  group: generate-article
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.161.1
  TZ: UTC

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # for pushing the article commit
      pull-requests: write  # for opening the draft PR

    steps:
      # ───────────────────────────────────────────────────────────────────
      - name: Checkout (full history for clean git operations)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the workflow token so subsequent pushes are authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'seo-pipeline/requirements.txt'

      - name: Install image tooling (librsvg2-bin, webp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin webp

      - name: Set up Hugo extended ${{ env.HUGO_VERSION }}
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install pipeline Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-pipeline/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "Article Pipeline"
          git config user.email "article-pipeline@cybersecurityelite.com"

      # ───────────────────────────────────────────────────────────────────
      - name: Generate article
        working-directory: ${{ github.workspace }}/seo-pipeline
        env:
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:             ${{ inputs.model }}
          SITE_ROOT:                ${{ github.workspace }}
          GIT_COMMIT_AUTHOR_NAME:   Article Pipeline
          GIT_COMMIT_AUTHOR_EMAIL:  article-pipeline@cybersecurityelite.com
        run: |
          set -euo pipefail

          # Build argv carefully so empty intent / blank optional flags don't
          # collapse into bogus positional args.
          ARGS=(
            "${{ inputs.topic }}"
            --section "${{ inputs.section }}"
          )
          if [[ -n "${{ inputs.intent }}" ]]; then
            ARGS+=(--intent "${{ inputs.intent }}")
          fi
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            ARGS+=(--publish)
          fi

          echo "→ python article.py ${ARGS[*]}"
          python article.py "${ARGS[@]}"

      # ───────────────────────────────────────────────────────────────────
      # When --publish=true, the pipeline already pushed. We're done.
      # When --publish=false, the pipeline committed locally but did NOT
      # push. We push to a draft branch and open a PR for review.
      # ───────────────────────────────────────────────────────────────────
      - name: Open draft PR (when publish=false)
        if: ${{ inputs.publish == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Derive the slug from the article path the pipeline just committed.
          slug=$(git log -1 --name-only --pretty=format: \
                 | grep -E '^content/.+\.md$' | head -1 \
                 | xargs -I {} basename {} .md)
          if [[ -z "$slug" ]]; then
            echo "::error::could not derive slug from the last commit"
            git log -1 --stat
            exit 1
          fi

          branch="draft/$(date -u +%Y%m%d-%H%M%S)-${slug}"
          echo "→ creating branch $branch"
          git checkout -b "$branch"
          git push origin "$branch"

          title=$(git log -1 --pretty=%s)
          gh pr create \
            --title  "draft: ${title}" \
            --base   main \
            --head   "$branch" \
            --body   "$(cat <<EOF
          Auto-generated by [\`seo-pipeline/article.py\`](../tree/main/seo-pipeline/article.py)
          via the [Generate Article](../actions/workflows/generate-article.yml) workflow.

          ### Inputs
          | Field    | Value |
          |----------|-------|
          | Topic    | ${{ inputs.topic }} |
          | Section  | ${{ inputs.section }} |
          | Intent   | ${{ inputs.intent || 'auto' }} |
          | Model    | ${{ inputs.model }} |

          ### Review checklist
          - [ ] Title/description lengths within target (50-65 / 140-160 chars)
          - [ ] Front-matter tags + keywords look right
          - [ ] No invented CVE numbers, event IDs, registry keys, version strings
          - [ ] Code blocks have correct language tags
          - [ ] FAQ schema renders (\`grep FAQPage public/${{ inputs.section }}/${slug}/index.html\`)
          - [ ] Cover image at \`static/images/articles/${slug}.png\` looks brand-correct

          The article ships with \`draft: true\`. To publish: flip
          \`draft: false\` on the article's front-matter, push, then merge.

          ---

          *Generated by Article Pipeline (CI run: [\`${{ github.run_id }}\`](../actions/runs/${{ github.run_id }}))*
          EOF
          )"

      # ───────────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "## Article generation run"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| Topic    | ${{ inputs.topic }} |"
            echo "| Section  | ${{ inputs.section }} |"
            echo "| Intent   | ${{ inputs.intent || 'auto' }} |"
            echo "| Model    | ${{ inputs.model }} |"
            echo "| Publish  | ${{ inputs.publish }} |"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              if [[ "${{ inputs.publish }}" == "true" ]]; then
                echo "✅ Pushed to **main**; the Hugo deploy workflow will publish in ~1 minute."
              else
                echo "✅ Opened a draft PR. Review, flip \`draft: false\`, merge to publish."
              fi
            else
              echo "❌ Job failed — see logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
